<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Delight</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-black">
    <header>
        <div class="container-full mx-auto border border-b-1 border-white flex justify-center py-4">
            <img src="assets/img/ws.png" class="w-[150px]" alt="logo" />
        </div>
    </header>
    <section>
        <div class="container border-1 border-red-500 mx-auto">
            <h1 class="text-white text-center py-8 lg:text-6xl md:text-4xl text-2xl font-bold">Find your next favorite
                meal</h1>
            <p class="text-gray-400 text-center lg:text-xl md:text-md text:xs">Search hundreds of recipes by name, ingredient, or cuisine.</p>
            <input class="border border-1 border-gray-500 text-gray-400 items-center my-5 text-lg py-1 bg-#071540 rounded-md w-full" type="text" placeholder="Try pasta, spicy, breakfast...">
        </div>
    </section>
</body>

</html>
