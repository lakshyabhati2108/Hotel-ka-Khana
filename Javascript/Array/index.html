<script>
    let arr = [1, 2, 3, 5, 4];

    for (i = 0; i < arr.length; i++) {
        for (j = 0; j < arr.length - i; j++) {
            if (arr[j] > arr[j + 1]) {
                let temp = arr[j];

                arr[j] = arr[j + 1];

                arr[j + 1] = temp;
            }
        }
        console.log(arr[i])
    }
</script>
