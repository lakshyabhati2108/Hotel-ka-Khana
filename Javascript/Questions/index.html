<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed of Train</title>
</head>

<body>

</body>
<script>
    let speed = parseFloat(prompt("Enter the Speed: "));

    let dist = parseFloat(prompt("Enter the Distance: "));

    let extra_time = parseFloat(prompt("Enter the Extra Time Taken: "))

    let time = parseFloat((dist / speed).toFixed(2));

    let total_time = time + extra_time;

    console.log("Total Time Taken:", total_time);
</script>

</html>
