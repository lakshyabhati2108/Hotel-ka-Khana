<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <section class="container">
        <div class="time">
            <p><i class="fa-solid fa-earth-americas"></i> YOUR LOCAL TIME</p>
            <span id="hours">00</span>
            <span class="separator">:</span>
            <span id="minutes">00</span>
            <span class="separator">:</span>
            <span id="seconds">00</span>
            <span id="period">AM</span>
            <p id="date">5/</p>
            <p id="month">oct/</p>
            <p id="year">2026</p>
        </div>

    </section>
</body>
<script src="main.js"></script>

</html>
